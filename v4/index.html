<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="apple-touch-icon" href="../icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}</style>
<title>الأجرة ورا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الأجرة ورا">
<meta name="theme-color" content="#22050c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap">
<style>
/* Layout: one phone-portrait screen — HUD, route strip, the windshield seen from the bench behind the driver, then the cash panel you play on */
:root{
  color-scheme: dark;
  --velvet:#5c1022; --velvet-2:#3a0914; --velvet-3:#22050c;
  --mustard:#f4b63f; --mustard-2:#c98b16;
  --evil:#22a3b8;
  --paper:#f7ecd6; --paper-dim:#cdb894;
  --ink:#1d1214;
  --good:#47c272; --bad:#ec5140;
  --f-display:"Lalezar","Baloo Bhaijaan 2",Tahoma,sans-serif;
  --f-body:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
}
html,body{height:100%}
body{
  margin:0;background:var(--velvet-3);color:var(--paper);font-family:var(--f-body);
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
#app{
  height:100%;max-width:560px;margin:0 auto;direction:rtl;display:flex;flex-direction:column;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px;box-sizing:border-box;
}
/* HUD */
.hud{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(244,182,63,.35);background:var(--velvet-2);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:var(--mustard);stroke-width:2.4;stroke-linecap:round}
.hud-route{flex:1;min-width:0;font-family:var(--f-display);font-size:18px;line-height:1.1;color:var(--mustard);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-score{font-family:var(--f-display);font-size:20px;line-height:1;display:flex;align-items:baseline;gap:3px;font-variant-numeric:tabular-nums}
.hud-score small{font-family:var(--f-body);font-size:11px;color:var(--paper-dim)}
.strikes{display:flex;gap:3px}
.strikes i{width:13px;height:13px;border-radius:50%;background:var(--evil);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #1d5fbf;display:block}
.strikes i.lost{background:#3b2a2e;box-shadow:inset 0 0 0 2px #5e4449}
/* route strip */
.route{position:relative;flex:none;height:30px;margin-inline:6px}
.route .line,.route .fill{position:absolute;top:7px;height:4px;border-radius:2px}
.route .line{left:0;right:0;background:#4a1a24}
.route .fill{right:0;background:var(--mustard);transition:width .25s linear}
.route .stop{position:absolute;top:2px;transform:translateX(50%);display:flex;flex-direction:column;align-items:center;width:64px}
.route .stop b{width:14px;height:14px;border-radius:50%;background:#4a1a24;border:2px solid var(--velvet-3);display:block}
.route .stop.done b{background:var(--mustard)}
.route .stop span{font-size:10px;line-height:1.2;color:var(--paper-dim);white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis}
.route .stop.next span{color:var(--paper);font-weight:800}
.route .stop:first-child{transform:translateX(30%)}
.route .stop:last-child{transform:translateX(70%)}
/* stage */
.stage{position:relative;flex:none;width:100%;aspect-ratio:7/6;max-height:44vh;border-radius:14px;overflow:hidden;background:#d9c09a}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* live speech / thought bubbles pinned over the 3D heads */
.b3{position:absolute;left:0;top:0;max-width:62%;width:max-content;background:#fffaf0;color:var(--ink);font-weight:800;font-size:13px;line-height:1.35;padding:5px 10px;border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.25);opacity:0;transition:opacity .18s;pointer-events:none;will-change:transform;z-index:2}
.b3.on{opacity:1}
.b3::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fffaf0;border-bottom:0}
.b3.angry{background:#ffd9d2;color:#7a0d06}.b3.angry::after{border-top-color:#ffd9d2}
.b3.drv{background:#fff1c2}.b3.drv::after{border-top-color:#fff1c2}
.b3.think{background:#eaf1ff;color:#2a3550;font-weight:600;border-radius:20px}
.b3.think::after{width:8px;height:8px;border:0;border-radius:50%;background:#eaf1ff;bottom:-11px;margin-left:-4px;box-shadow:-6px 7px 0 -1px #eaf1ff}
.banner{position:absolute;top:10%;left:50%;transform:translateX(-50%) scale(.8);opacity:0;background:var(--mustard);color:var(--ink);font-family:var(--f-display);font-size:22px;padding:2px 16px 0;border-radius:6px;box-shadow:0 3px 0 var(--mustard-2);transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.banner.on{opacity:1;transform:translateX(-50%) scale(1)}
.say{position:absolute;max-width:62%;background:var(--paper);color:var(--ink);font-weight:800;font-size:13px;line-height:1.35;padding:6px 10px;border-radius:12px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
.say.on{opacity:1;transform:none}
.say.driver{top:27%;left:3%;max-width:55%;border-bottom-left-radius:2px}
.say.angry{background:#ffd9d2;color:#7a0d06}
.alight{position:absolute;bottom:16%;right:3%;background:var(--bad);color:#fff;border:0;border-radius:12px;font-family:var(--f-display);font-size:17px;padding:6px 12px 3px;box-shadow:0 4px 0 #8f1f14;animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
.patience{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(0,0,0,.45)}
.patience i{display:block;height:100%;width:100%;background:var(--good);margin-inline-start:auto;transition:background-color .3s}
/* fare board */
.fares{flex:none;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;align-items:center;min-height:26px}
.fares::-webkit-scrollbar{display:none}
.fares .lbl{font-family:var(--f-display);font-size:14px;color:var(--mustard);flex:none}
.chip{flex:none;font-size:12px;background:var(--velvet-2);border:1px solid #5d2531;border-radius:999px;padding:1px 9px;white-space:nowrap}
.chip b{color:var(--mustard);font-variant-numeric:tabular-nums}
.peek{flex:none;font-size:12px;background:transparent;border:1px dashed var(--mustard);border-radius:999px;padding:1px 10px;color:var(--mustard)}
/* panel */
.panel{
  flex:1;min-height:0;overflow-y:auto;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;
  background:
    linear-gradient(45deg,rgba(244,182,63,.05) 25%,transparent 25%,transparent 75%,rgba(244,182,63,.05) 75%) 0 0/22px 22px,
    linear-gradient(45deg,rgba(244,182,63,.05) 25%,transparent 25%,transparent 75%,rgba(244,182,63,.05) 75%) 11px 11px/22px 22px,
    var(--velvet);
  box-shadow:inset 0 0 0 1px rgba(244,182,63,.18);
}
.panel.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pax{display:flex;gap:10px;align-items:flex-start}
.face{width:46px;height:46px;flex:none;border-radius:50%;background:var(--velvet-2);display:grid;place-items:center;font-size:28px;box-shadow:inset 0 0 0 2px var(--mustard)}
.pax-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pax-name{font-size:12px;color:var(--paper-dim)}
.pax-name b{color:var(--paper)}
.bubble{background:var(--paper);color:var(--ink);font-weight:800;font-size:16px;line-height:1.35;padding:6px 11px;border-radius:12px;border-top-right-radius:2px}
.react{font-size:13px;font-weight:800;min-height:18px}
.react.good{color:var(--good)} .react.bad{color:#ff8b7d}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-label{font-size:12px;color:var(--paper-dim)}
.money{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:32px}
.tray{background:rgba(0,0,0,.25);border-radius:10px;padding:5px;border:1px dashed #7a3442;min-height:40px}
.tray:empty::before{content:"دوس على الفلوس اللي تحت عشان ترجّع الباقي";font-size:12px;color:#a07f86;padding-inline:4px}
.sum{font-family:var(--f-display);font-size:18px;color:var(--mustard);font-variant-numeric:tabular-nums}
/* money */
.bill,.coin{border:0;padding:0;font-family:var(--f-display);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none;line-height:1}
.bill{width:60px;height:31px;border-radius:4px;color:#fff;font-size:19px;gap:4px;box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.22);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.bill::before{content:"";position:absolute;inset:4px 34px 4px 4px;border-radius:50%;background:rgba(255,255,255,.18)}
.bill i{font-style:normal;font-family:var(--f-body);font-size:10px;font-weight:800;opacity:.85}
.coin{width:32px;height:32px;border-radius:50%;font-size:13px;color:#3a2a10;box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.35)}
.v0_5{background:radial-gradient(circle at 35% 30%,#fff3c4,#d9b24a 60%,#a7801f)}
.v1{background:radial-gradient(circle at 35% 30%,#ffffff,#c7c9cc 45%,#d7b45a 47%,#b48a2a)}
.v5{background:linear-gradient(135deg,#3b9a8f,#22665f)}
.v10{background:linear-gradient(135deg,#e46a4a,#a83a26)}
.v20{background:linear-gradient(135deg,#5f9e45,#356b25)}
.v50{background:linear-gradient(135deg,#d08c3a,#8d521a)}
.v100{background:linear-gradient(135deg,#3f7fbf,#234f86)}
.v200{background:linear-gradient(135deg,#8d8b35,#575516)}
.pouch{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding-top:2px}
.pouch .bill{width:64px;height:38px;font-size:21px}
.pouch .coin{width:40px;height:40px;font-size:15px}
.pouch button:active,.tray button:active{transform:translateY(2px)}
.pouch button:disabled{opacity:.28;filter:grayscale(.7)}
.cnt{position:absolute;top:-7px;left:-7px;min-width:18px;height:18px;border-radius:9px;background:var(--paper);color:var(--ink);font:800 11px/18px var(--f-body);text-align:center;font-style:normal;text-shadow:none;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.pouch-head b{color:var(--mustard)}
.pouch-head .hint{color:var(--paper);background:var(--bad);border-radius:6px;padding:1px 8px;font-weight:800}
.btns.small .go{font-size:16px;padding:6px 8px 3px}
.go:disabled{opacity:.4}
.face img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.go{border:0;border-radius:12px;background:var(--mustard);color:var(--ink);font-family:var(--f-display);font-size:21px;padding:9px 12px 5px;box-shadow:0 4px 0 var(--mustard-2)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mustard-2)}
.go.alt{background:var(--velvet-2);color:var(--paper);box-shadow:0 4px 0 #14030a;border:1px solid #6d2a39}
.btns{display:flex;gap:8px}
.btns > *{flex:1}
.queue{font-size:12px;color:var(--paper-dim)}
/* keypad */
.kpd{background:#0e2a16;color:#8dffa9;font-family:var(--f-display);font-size:30px;border-radius:10px;padding:4px 12px 0;text-align:left;direction:ltr;letter-spacing:1px;box-shadow:inset 0 0 12px rgba(0,0,0,.6);font-variant-numeric:tabular-nums;min-height:44px}
.kpd small{font-size:16px;color:#5fc27a}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;direction:ltr}
.keypad button{height:40px;border-radius:10px;border:1px solid #6d2a39;background:var(--velvet-2);font-family:var(--f-display);font-size:22px}
.keypad button:active{background:#5a1a28}
.log{display:flex;flex-direction:column;gap:2px;font-size:13px;background:rgba(0,0,0,.2);border-radius:10px;padding:6px 10px}
.log span{display:flex;justify-content:space-between;gap:8px}
.log em{font-style:normal;color:var(--paper-dim)}
.log b{color:var(--mustard)}
.log .total{border-top:1px dashed #7a3442;padding-top:3px;margin-top:2px}
.step{font-size:13px;color:var(--paper-dim)}
.step b{background:var(--mustard);color:var(--ink);border-radius:6px;padding:0 8px;margin-inline-end:6px;font-weight:800}
.helper{background:rgba(34,163,184,.16);border:1px solid rgba(34,163,184,.5);border-radius:10px;padding:5px 10px;font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums}
.helper b{color:var(--mustard)}
.howto{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.howto li{display:flex;gap:10px;align-items:flex-start;line-height:1.55}
.howto li::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--mustard);color:var(--ink);font-family:var(--f-display);display:grid;place-items:center;font-size:16px}
.howto b{color:var(--mustard)}
.wait{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;flex:1;min-height:120px}
.wait b{font-family:var(--f-display);font-size:28px;color:var(--mustard);font-weight:400}
.wait span{color:var(--paper-dim);font-size:14px}
.pop{position:fixed;pointer-events:none;font-family:var(--f-display);font-size:24px;color:var(--good);text-shadow:0 2px 0 #0008;animation:pop .9s forwards;z-index:30}
.pop.bad{color:var(--bad)}
@keyframes pop{to{transform:translateY(-50px);opacity:0}}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:rgba(20,3,8,.82);display:flex;justify-content:center;overflow-y:auto;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px)}
.ov[hidden]{display:none!important}
.sheet{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
.logo{font-family:var(--f-display);font-size:64px;line-height:.95;color:var(--mustard);text-align:center;text-shadow:0 4px 0 var(--velvet),0 8px 0 #0006;margin-top:4px}
.logo small{display:block;font-size:20px;color:var(--paper);text-shadow:none;margin-top:6px}
.lede{text-align:center;color:var(--paper-dim);font-size:14px;line-height:1.6;margin:0;text-wrap:balance}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lv{border:1px solid #6d2a39;background:var(--velvet-2);border-radius:12px;padding:8px 10px;text-align:right;display:flex;flex-direction:column;gap:1px;min-width:0}
.lv .n{font-size:11px;color:var(--paper-dim)}
.lv .t{font-family:var(--f-display);font-size:17px;line-height:1.15;color:var(--paper)}
.lv .d{font-size:11px;color:var(--paper-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .s{color:var(--mustard);font-size:14px;letter-spacing:2px}
.lv .s .off{color:#5a3a40}
.lv[disabled]{opacity:.45;cursor:not-allowed}
.settings{display:flex;flex-direction:column;gap:8px;background:var(--velvet-2);border-radius:12px;padding:10px}
.settings label,.settings .set{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.settings select{font-family:inherit;font-size:14px;background:var(--velvet-3);color:var(--paper);border:1px solid #6d2a39;border-radius:8px;padding:4px 8px}
.toggle{border:1px solid #6d2a39;background:var(--velvet-3);border-radius:999px;padding:3px 12px;font-size:13px}
.toggle[aria-pressed="true"]{background:var(--mustard);color:var(--ink);border-color:var(--mustard)}
.file-btn{position:relative;overflow:hidden;border:1px solid var(--mustard);color:var(--mustard);border-radius:999px;padding:3px 12px;font-size:13px}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note{font-size:12px;color:#a88a90;text-align:center;line-height:1.5;margin:0}
.card{background:var(--velvet);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 1px rgba(244,182,63,.25)}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;color:var(--mustard);text-wrap:balance}
.card p{margin:0;line-height:1.6;color:var(--paper)}
.tbl{display:flex;flex-direction:column;gap:3px;background:rgba(0,0,0,.25);border-radius:10px;padding:8px 12px}
.tbl span{display:flex;justify-content:space-between;font-size:15px}
.tbl b{color:var(--mustard);font-variant-numeric:tabular-nums}
.stars{font-size:44px;text-align:center;color:var(--mustard);letter-spacing:6px;line-height:1}
.stars .off{color:#4a2a30}
@media (prefers-reduced-motion:reduce){.alight{animation:none}.pop{animation-duration:.01s}.panel.shake{animation:none}}
@media (max-height:640px){.logo{font-size:52px}.bubble{font-size:15px}.pouch .bill{height:34px}.pouch .coin{width:36px;height:36px}.keypad button{height:38px}}
/* guided first ride */
.tour{position:fixed;inset:0;z-index:1000;pointer-events:none}
.tour[hidden]{display:none}
.tour .tb{position:fixed;background:rgba(10,2,5,.72);pointer-events:auto;transition:all .25s ease}
.tour .tb.cover{background:transparent}
.tour .th{position:fixed;border:3px solid var(--mustard);border-radius:12px;pointer-events:none;transition:all .25s ease;box-shadow:0 0 18px rgba(244,182,63,.55)}
.tour.act .th{animation:tourPulse 1s ease-in-out infinite}
@keyframes tourPulse{50%{box-shadow:0 0 0 7px rgba(244,182,63,.35),0 0 26px rgba(244,182,63,.8)}}
.tour .tt{position:fixed;pointer-events:auto;box-sizing:border-box;background:var(--paper,#fff7e6);color:var(--ink,#1a0c08);border-radius:14px;padding:12px 14px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5);border:2px solid var(--mustard);transition:top .25s ease,left .25s ease;font-size:15px;line-height:1.6}
.tour .tx b{color:#9b1c2e}
.tour .tf{display:flex;align-items:center;gap:8px;margin-top:8px}
.tour .tn{flex:1;text-align:center;font-size:11px;opacity:.6}
.tour .skip{background:none;border:0;color:inherit;opacity:.65;font:inherit;font-size:12px;text-decoration:underline;padding:4px}
.tour .nx{width:auto;min-width:96px;padding:6px 16px;margin:0}
.tour .nx[hidden]{display:none}
</style>

</head>
<body>
<div id="app">
  <header class="hud">
    <button class="icon-btn" id="btnMenu" aria-label="القائمة"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="hud-route" id="hudRoute">الأجرة ورا</div>
    <div class="strikes" id="strikes" aria-label="الفرص"></div>
    <div class="hud-score"><span id="score">0</span><small>نقطة</small></div>
  </header>
  <div class="route" id="route"></div>
  <div class="stage" id="stage">
    <canvas id="scene"></canvas>
    <div class="banner" id="banner"></div>
    <button class="alight" id="alight" hidden>على جنب يا أسطى!</button>
    <div class="patience" aria-hidden="true"><i id="patience"></i></div>
  </div>
  <div class="fares" id="fares"></div>
  <main class="panel" id="panel"></main>
</div>

<div class="ov" id="ov"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const r2=x=>Math.round(x*2)/2;
const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeTrack(st){
  const r=mulberry(st.seed);
  const sec=()=>{
    const m=new Array(32).fill(null);let d=st.style==='tar'?3:4;
    for(let s=0;s<32;s++){
      let p=s%4===0?0.9:(s%2===0?0.55:(st.style==='mah'?0.3:0.1));
      if(st.style==='tar'&&s%2)p=0.06;
      if(r()<p){d+=[-2,-1,-1,0,1,1,2][Math.floor(r()*7)];if(d<0)d=1;if(d>10)d=9;m[s]=d;}
    }
    const end=new Array(16).fill(null);end[0]=9;end[2]=8;end[4]=8;end[6]=7.5;end[8]=7;
    return m.concat(m.slice(0,16),end);
  };
  return {A:sec(),B:sec()};
}

function freqOf(st,deg){const oct=Math.floor(deg/7),k=Math.round(((deg%7)+7)%7);return st.root*Math.pow(2,(st.scale[Math.min(6,k)]+12*oct)/12);}

function audioInit(){
  if(A.ctx){if(A.ctx.state!=='running')A.ctx.resume();return;}
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const C=new AC();A.ctx=C;
  A.master=C.createGain();A.master.gain.value=0.9;A.master.connect(C.destination);
  // microbus speaker: boomy low end, then squashed loud
  const shelf=C.createBiquadFilter();shelf.type='lowshelf';shelf.frequency.value=110;shelf.gain.value=11;
  const thump=C.createBiquadFilter();thump.type='peaking';thump.frequency.value=60;thump.Q.value=1;thump.gain.value=5;
  const comp=C.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=4;comp.attack.value=0.005;comp.release.value=0.2;
  A.speaker=C.createGain();A.speaker.gain.value=0.85;A.speaker.connect(shelf);shelf.connect(thump);thump.connect(comp);comp.connect(A.master);
  const hp=C.createBiquadFilter();hp.type='highpass';hp.frequency.value=35;
  const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=7000;
  A.musicIn=C.createGain();A.musicIn.gain.value=0.6;A.musicIn.connect(hp);hp.connect(lp);lp.connect(A.speaker);
  A.sfx=C.createGain();A.sfx.gain.value=0.8;A.sfx.connect(A.master);
  const nb=C.createBuffer(1,C.sampleRate,C.sampleRate),ch=nb.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;A.noise=nb;
  // engine + road
  const eo=C.createOscillator();eo.type='sawtooth';eo.frequency.value=34;
  const ef=C.createBiquadFilter();ef.type='lowpass';ef.frequency.value=160;
  A.engG=C.createGain();A.engG.gain.value=0.02;eo.connect(ef);ef.connect(A.engG);A.engG.connect(A.master);eo.start();A.engO=eo;
  const rn=C.createBufferSource();rn.buffer=nb;rn.loop=true;const rf=C.createBiquadFilter();rf.type='lowpass';rf.frequency.value=420;
  A.roadG=C.createGain();A.roadG.gain.value=0;rn.connect(rf);rf.connect(A.roadG);A.roadG.connect(A.master);rn.start();
  A.next=C.currentTime+0.1;setInterval(schedule,25);
  C.resume();
  playTrack(A.want);
}
function noiseSrc(t,dur){const s=A.ctx.createBufferSource();s.buffer=A.noise;s.start(t,Math.random()*0.5,dur+0.05);return s;}
function gEnv(t,peak,a,d,dest){const g=A.ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);g.connect(dest);return g;}
function filt(type,f,q){const b=A.ctx.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b;}
function tone(type,f,t,dur,peak,dest,f2){const o=A.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=gEnv(t,peak,0.005,dur,dest);o.connect(g);o.start(t);o.stop(t+dur+0.05);return o;}

function leadMah(f,t,dur){
  const C=A.ctx,lp=filt('lowpass',2700,2),g=C.createGain();
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.085,t+0.01);g.gain.setValueAtTime(0.085,t+dur*0.85);g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.04);
  lp.connect(g);g.connect(A.musicIn);
  [['sawtooth',-7],['square',7]].forEach(([ty,det])=>{
    const o=C.createOscillator();o.type=ty;o.detune.value=det;
    if(A.prevF){o.frequency.setValueAtTime(A.prevF,t);o.frequency.exponentialRampToValueAtTime(f,t+0.035);}else o.frequency.setValueAtTime(f,t);
    const l=C.createOscillator(),lg=C.createGain();l.frequency.value=6;lg.gain.value=f*0.012;l.connect(lg);lg.connect(o.frequency);l.start(t+0.06);l.stop(t+dur+0.1);
    o.connect(lp);o.start(t);o.stop(t+dur+0.1);
  });

}
function leadAcc(f,t,dur){

/* poses are blended toward targets every frame, so every action is smooth and can be interrupted */
const lerp=(a,b,k)=>a+(b-a)*k;
function setAnim(P,a,dur){P.anim=a;P.animT=0;P.until=dur?NOW+dur:0;}
function poseStep(P,dt){
  const t=NOW,k=Math.min(1,dt*9),sit=P.state==='seat',walk=P.state==='walk';
  let a=P.anim;if(P.until&&t>P.until){a=P.anim=P.reach?'reach':'idle';P.until=0;}
  P.animT+=dt;const ph=P.animT;
  // defaults
  let shL=0.15,shR=0.15,elL=0.35,elR=0.35,shLz=0,shRz=0,hy=P.look,hx=0,ty=0,tx=0.03,mouth=0,brow=0;
  if(sit){shL=0.55;shR=0.55;elL=0.9;elR=0.9;}
  if(P.isDriver){shL=1.05;shR=1.05;elL=0.55;elR=0.55;shLz=-0.12;shRz=0.12;}
  if(P.talk>t||a==='argue'){mouth=0.5+0.5*Math.sin(ph*17)*Math.sin(ph*5.3);}
  if(a==='talk'){hx=Math.sin(ph*4)*0.06;shR=lerp(shR,0.9,0.6)+Math.sin(ph*3)*0.15;elR=1.2;}
  else if(a==='thank'){hx=0.18*Math.max(0,Math.sin(ph*3));shR=1.2;elR=1.6;}
  else if(a==='argue'){brow=1;shL=1.0+Math.sin(ph*7)*0.35;shR=1.0+Math.sin(ph*7+1.5)*0.35;elL=elR=1.1;hx=Math.sin(ph*9)*0.05;}
  else if(a==='point'){shR=1.75;elR=0.15;shRz=-0.25;}
  else if(a==='call'){shR=1.7;elR=0.25;shRz=-0.35;hx=-0.1;}
  else if(a==='phone'){shR=0.4;elR=2.4;shRz=0.55;hy+=0.2;mouth=P.talk>0?0.5+0.5*Math.sin(ph*15):0;}
  else if(a==='pay'){if(P.ahead){shR=-1.15;elR=0.2;shRz=0.3;ty=-0.45;}else{shR=1.35;elR=0.35;shRz=-0.2;}}   // riders in front pass the money back over the seat
  else if(a==='think'){shR=0.9;elR=2.3;shRz=0.3;hx=-0.08;}
  else if(a==='angry'){brow=1;hx=-0.05;}
  else if(a==='reach'){shR=-1.25;elR=0.25;shRz=0.35;ty=-0.55;hy=-1.0;}  // driver: arm back between the seats
  else if(a==='turn'){hy=-1.25;ty=-0.3;brow=P.angry?1:0;mouth=0.5+0.5*Math.sin(ph*17);}
  else if(a==='wave'){shR=2.6;elR=0.4+Math.sin(ph*10)*0.4;}
  if(P.isDriver&&a==='idle'){const st=dyn.steer||0;shL+=st*0.25;shR-=st*0.25;}
  // walking / standing legs
  let th=sit?Math.PI/2:0,kn=sit?-Math.PI/2:0,thL=th,thR=th,knL=kn,knR=kn;
  if(walk){const w=Math.sin(ph*9);thL=w*0.5;thR=-w*0.5;knL=Math.max(0,-w)*-0.6;knR=Math.max(0,w)*-0.6;shL=-w*0.4;shR=w*0.4;elL=elR=0.3;}
  // idle life: breathing, glances, blinking
  P.blink-=dt;if(P.blink<0)P.blink=rnd(2,5);
  P.lookT-=dt;if(P.lookT<0&&!P.isDriver){P.lookT=rnd(1.5,4.5);P.look=pick([0,0,0.5,-0.5,1.1,-1.1]);}
  P.shL.rotation.x=lerp(P.shL.rotation.x,shL,k);P.shR.rotation.x=lerp(P.shR.rotation.x,shR,k);
  P.shL.rotation.z=lerp(P.shL.rotation.z,shLz,k);P.shR.rotation.z=lerp(P.shR.rotation.z,shRz,k);
  P.elL.rotation.x=lerp(P.elL.rotation.x,elL,k);P.elR.rotation.x=lerp(P.elR.rotation.x,elR,k);
  P.thL.rotation.x=lerp(P.thL.rotation.x,thL,k*1.4);P.thR.rotation.x=lerp(P.thR.rotation.x,thR,k*1.4);
  P.knL.rotation.x=lerp(P.knL.rotation.x,knL,k*1.4);P.knR.rotation.x=lerp(P.knR.rotation.x,knR,k*1.4);
  P.head.rotation.y=lerp(P.head.rotation.y,hy+(P.faceCam||0),k*0.7);P.head.rotation.x=lerp(P.head.rotation.x,hx,k);
  P.torso.rotation.y=lerp(P.torso.rotation.y,ty,k*0.6);P.torso.rotation.x=lerp(P.torso.rotation.x,tx,k);
  P.torso.position.y=Math.sin(t*1.7+P.g.id)*0.006;
  P.mouth.scale.y=lerp(P.mouth.scale.y,1+mouth*3.2,0.5);
  P.brows[0].rotation.z=lerp(P.brows[0].rotation.z,brow*-0.45,k);P.brows[1].rotation.z=lerp(P.brows[1].rotation.z,brow*0.45,k);
  P.prop.visible=a==='pay'||a==='phone';
  if(a==='phone'){P.prop.material=mat('#222222');P.prop.scale.set(0.6,1.6,1);}else{P.prop.material=mat('#4f9a6f');P.prop.scale.set(1,1,1);}
  const bl=P.blink<0.12?0.12:1;P.eyes[0].scale.y=P.eyes[1].scale.y=bl;
}

/* ---------- speech and thought bubbles: DOM over the canvas, pinned to a head ---------- */
const bubbles=[];
function say(P,text,o={}){
  if(!P)return;
  let b=bubbles.find(x=>x.P===P);
  if(!b){const el=document.createElement('div');el.className='b3';stage.appendChild(el);b={P,el};bubbles.push(b);}
  b.el.className='b3'+(o.think?' think':'')+(o.angry?' angry':'')+(P.isDriver?' drv':'');
  b.el.textContent=(o.think?'💭 ':'')+text;b.until=NOW+(o.dur||Math.max(2.2,text.length*0.085));b.el.classList.add('on');
  if(!o.think){P.talk=b.until;if(!o.keepAnim)setAnim(P,o.anim||(o.angry?'argue':'talk'),b.until-NOW);}
}
const _v=new T.Vector3();
function placeBubbles(){
  const W=stage.clientWidth,H=stage.clientHeight;
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];
    if(NOW>b.until||!b.P.g.parent){b.el.classList.remove('on');if(NOW>b.until+0.4){b.el.remove();bubbles.splice(i,1);}continue;}
    b.P.head.getWorldPosition(_v);_v.y+=0.3*b.P.s;_v.project(cam);
    const behind=_v.z>1;let x=(_v.x*0.5+0.5)*W,y=(-_v.y*0.5+0.5)*H;
    if(behind){x=W-x;y=H*0.3;}
    const bw=b.el.offsetWidth,bh=b.el.offsetHeight;
    x=Math.max(bw/2+6,Math.min(W-bw/2-6,x));y=Math.max(bh+6,Math.min(H-10,y));
    b.el.style.transform=`translate(${x-bw/2}px,${y-bh}px)`;
  }
}

function buildRoute(i){
  routeG.clear();
  const def=ROUTES[i]||ROUTES[0],zones=[];
  def.pieces.forEach(p=>{
    const g=new T.Group();g.position.set(p.x!=null?p.x:(p.side===1?FRONT[1]:leftFront),0,-p.d);
    if(p.side===-1&&p.k!=='limoun_bridge')g.rotation.y=Math.PI;

function alight(r,delay){
  const P=r.P;P.state='walk';P.delay=delay||0;
  P.path=[new T.Vector3(0.62,0.87*P.s,SEATS[r.seat][1]+0.1),new T.Vector3(1.0,0.87*P.s-0.2,DOOR[1]),new T.Vector3(2.6,WALK_Y+0.87*P.s,DOOR[1]-0.6),new T.Vector3(3.2,WALK_Y+0.87*P.s,DOOR[1]+3)];

let leavers=[];
function walkStep(P,dt){
  if(P.delay>0){P.delay-=dt;if(P.delay<=0)P.g.visible=true;return;}
  const tgt=P.path[P.pathI];if(!tgt)return;
  const d=tgt.clone().sub(P.g.position),len=d.length(),v=1.5*dt;
  if(len<v){P.g.position.copy(tgt);P.pathI++;
    // once out on the pavement they belong to the street, so the bus drives off without them
    if(P.leaving&&P.pathI===3&&P.g.parent===bus){world.attach(P.g);P.path=[P.g.position.clone().add(new T.Vector3(1.2,0,3))];P.pathI=0;return;}
    if(P.pathI>=P.path.length){
      if(P.leaving){P.g.removeFromParent();leavers=leavers.filter(x=>x!==P);return;}
      P.state='seat';P.g.position.y=SEAT_Y;P.g.rotation.y=0;P.animT=0;

   MOTION: the bus position follows the game clock, so it always pulls in exactly at the stop

let pos=0,lastPos=0,vel=0,NOW=0,stopsN=5,running=false,cruise=false;

function angTo(p){const d=p.clone().sub(cam.position);return[Math.atan2(-d.x,-d.z),Math.atan2(d.y,Math.hypot(d.x,d.z))];}

const AMBIENT=[
 ['phone','أيوه يا ماما، أنا في الميكروباص... خمس دقايق'],['phone','ألو؟ إنت فين؟ أنا عدّيت رمسيس'],
 ['talk','الدنيا زحمة النهارده'],['talk','يا أسطى وطّي المهرجان شوية'],['talk','هو إحنا لسه في أحمد حلمي؟'],
 ['talk','الأسطى ده سايق طيارة!'],['think','الحر ده مش طبيعي'],['think','نسيت أجيب العيش'],['talk','افتح الشباك ده شوية']];
const DRIVER_AMB=['يلا يا جماعة، الأجرة','اقفل الباب كويس يا اللي ورا!','حد نازل قبل عبود؟','الطريق واقف خالص','عبود! عبود! عبود!'];

function update(dt,st){
  NOW+=dt;
  // where should the bus be?
  let target=pos;
  if(st.lv){
    const i=st.stopIdx,base=i*SEG;
    if(st.phase==='drive'){let p=st.segT/st.segDur;if(st.tut){tutP=Math.min(0.8,tutP+dt/40);p=tutP;}target=base+SEG*ease(p);}
    else target=base;
    pos=target;
  }else{pos+=dt*6;}
  vel=lerp(vel,(pos-lastPos)/Math.max(dt,1e-3),Math.min(1,dt*6));const acc=(pos-lastPos)/Math.max(dt,1e-3)-vel;lastPos=pos;
  world.position.z=pos;
  SCROLL.forEach(([t,len,ax,face])=>{if(ax==='x')t.offset.x=face*pos/len;else t.offset.y=-pos/len;});
  recycleBuildings();
  // traffic and the occasional train next to the tracks
  for(const v of traffic){v.mesh.position.z+=(vel-v.v*v.lane)*dt;if(v.mesh.position.z>45||v.mesh.position.z<-170)newVeh(v,false);}
  if(ROUTE&&ROUTE.def.left==='rail'){
    if(!train.on&&Math.random()<dt/25){train.on=true;train.z=-180;train.v=rnd(10,15);}
    if(train.on){train.z+=(vel+train.v)*dt;if(train.z>120){train.on=false;train.z=-400;}}
    train.mesh.position.z=train.z;train.mesh.visible=train.on;
  }else train.mesh.visible=false;

  const sp=vel/9;

  if(sp>0.3){camS.bumpV+=(Math.random()-0.5)*10*sp*dt*8;if(Math.random()<dt*0.08*sp){camS.bumpV+=40;if(typeof sfx==='function')sfx('thud');}}
  camS.swV+=(-14*camS.sw-1.6*camS.swV-acc*0.03)*dt;camS.sw+=camS.swV*dt;
  dyn.steer=Math.sin(NOW*0.5)*0.25*sp+Math.sin(NOW*1.7)*0.08*sp;dyn.wheel.rotation.z=dyn.steer*1.6;

  riders.forEach(r=>{const P=r.P;P.faceCam=(P.talk>NOW&&P.state==='seat')?faceToCam(P):0;});
  ambient(dt,st);
  // camera: looks ahead, turns toward whoever is dealing with you
  let [fy,fp]=[-0.08,-0.13];
  const tgt=focus&&focus.P&&focus.P.g.parent?focus.P:null;
  focusW=lerp(focusW,tgt?1:0,Math.min(1,dt*3));
  // with nobody to deal with, you glance out at the landmark you're passing, and at the stop when you pull in
  if(!tgt&&ROUTE){
    const near=ROUTE.def.pieces.find(p=>p.k!=='limoun_bridge'&&p.k!=='shopfront'&&(p.zone?pos>p.zone[0]-35&&pos<p.zone[1]-8:p.d-pos>-6&&p.d-pos<40));

const _h=new T.Vector3();
function faceToCam(P){P.g.getWorldPosition(_h);const d=cam.position.clone().sub(_h);const a=Math.atan2(-d.x,-d.z)-P.g.rotation.y;let x=a;while(x>Math.PI)x-=2*Math.PI;while(x<-Math.PI)x+=2*Math.PI;return Math.max(-1.7,Math.min(1.7,x))*(P.ahead?0.75:1);}

  else{driver.reach=false;if(driver.anim==='reach')setAnim(driver,'idle');}

const G={running:false,paused:false,lv:null,li:0,stopIdx:0,phase:'idle',mode:'idle',segT:0,segDur:1,phaseT:0,queue:[],batch:[],cur:null,tray:[],kp:'',paid:false,onboard:[],score:0,strikes:0,alightAsked:false,warned:false,turnUntil:0,token:0,peekUntil:0};
const panel=$('#panel');

/* no video anywhere: the windshield is the live 3D scene (V3D), which follows the game clock */
function startLevel(i){
  audioInit();
  G.li=i;G.lv=LEVELS[i];resetFloat();playTrack(G.lv.track);G.stopIdx=0;G.score=0;G.strikes=0;G.onboard=[];G.token++;G.running=true;G.paused=false;G.phase='stop';G.mode='idle';G.peekUntil=0;
  V3D.start(i,G.lv.stops.map(s=>s[0]),G.lv.tod);
  closeOv();hud();renderFares();enterStop();
}
function enterStop(){
  const lv=G.lv,s=G.stopIdx,last=lv.stops.length-1;
  G.phase='stop';G.phaseT=0;S.target=0;
  banner(lv.stops[s][0]);
  const leaving=G.onboard.filter(p=>p.dest===s);
  if(s>0&&s<last&&leaving.length&&!G.alightAsked){G.score=Math.max(0,G.score-5);driverSay('ما تقول بدري يا عم! كنا عدّينا المحطة',true);popAt('-5',true);}
  G.onboard=G.onboard.filter(p=>p.dest!==s);G.alightAsked=false;$('#alight').hidden=true;
  hud();
  if(s===last){G.phase='end';G.mode='idle';V3D.arrive(s,[],true);setTimeout(()=>finishLevel(G.token),2600);panelWait('آخر الخط','الكل نازل... يلا بينا');return;}
  sfx('door');
  const n=ri(lv.pax[0],lv.pax[1]);const used=new Set();
  G.queue=Array.from({length:n},()=>makePax(s,used));G.batch=G.queue.slice();G.paid=false;G.cur=null;G.mode='idle';
  V3D.arrive(s,G.queue,false);
  panelWait(lv.stops[s][0],`${NUM[n]==='واحد'?'راكب واحد طالع':NUM[n]+' ركاب طالعين'}... جهّز الفكة`);
}
function makePax(s,used){
  const lv=G.lv,last=lv.stops.length-1,dests=[];for(let j=s+1;j<=last;j++)dests.push(j);
  const total=ri(1,lv.group);let parts;
  if(lv.mixed&&total>=2&&dests.length>=2&&Math.random()<0.5){const a=pick(dests);let b;do{b=pick(dests);}while(b===a);const na=ri(1,total-1);parts=[{n:na,dest:a},{n:total-na,dest:b}].sort((x,y)=>x.dest-y.dest);}
  else parts=[{n:total,dest:pick(dests)}];
  const fare=r2(parts.reduce((t,p)=>t+p.n*lv.stops[p.dest][1],0));
  const paid=makePayment(fare,lv),exact=eq(sum(paid),fare);
  let who;do{who=pick(PEOPLE);}while(used.has(who[0])&&used.size<PEOPLE.length);used.add(who[0]);
  const ask=parts.map(p=>`${NUM[p.n]} ${li(lv.stops[p.dest][0])}`).join(' و');
  const g=pick(GREET),tail=exact?' مظبوط':pick([' وهات الباقي','',' ومعاك فكة؟','']);
  return {name:who[0],face:faceHTML(PEOPLE.indexOf(who),who[1]),parts,fare,paid,change:r2(sum(paid)-fare),text:`${g} ${ask}${tail}`.trim(),where:pick(['من الكنبة اللي ورا','من آخر كنبة','من جنبك','من ورا خالص'])};
}
function decompose(v,maxB,half){const out=[];const ds=[200,100,50,20,10,5,1].filter(d=>d<=maxB||d<5);if(half)ds.push(0.5);for(const d of ds){while(v>=d-0.001){out.push(d);v=r2(v-d);}}return out;}
function makePayment(fare,lv){
  const bills=lv.bills,maxB=bills[bills.length-1];
  if(Math.random()<0.14)return decompose(fare,maxB,lv.half);
  const big=bills.filter(b=>b>=fare);
  if(big.length){
    const lower=bills.filter(b=>b<fare);
    if(lower.length&&Math.random()<0.3){const b1=lower[lower.length-1],b2=bills.find(b=>b1+b>=fare)||big[0];if(b1+b2>fare)return[b1,b2];}
    return[Math.random()<0.6?big[0]:pick(big)];
  }

  out.pop();s-=maxB;const fin=bills.find(b=>s+b>=fare)||maxB;out.push(fin);return out;
}
function pouchDenoms(){const lv=G.lv,maxB=lv.bills[lv.bills.length-1];const d=[];if(lv.half)d.push(0.5);d.push(1);[5,10,20,50,100,200].forEach(v=>{if(v<=maxB||G.wallet[v])d.push(v);});return d;}
/* the fakka in your hand: real coins and bills, counted */
const wAdd=arr=>arr.forEach(v=>{G.wallet[v]=(G.wallet[v]||0)+1;});
const wTotal=()=>r2(Object.keys(G.wallet).reduce((s,k)=>s+k*G.wallet[k],0));
function resetFloat(){G.wallet={};Object.keys(G.lv.float).forEach(k=>G.wallet[k]=G.lv.float[k]);}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!G.paused){
    tick(dt);
    V3D.update(dt,{lv:G.lv,running:G.running,phase:G.phase,mode:G.mode,stopIdx:G.stopIdx,segT:G.segT,segDur:G.segDur,tut:!!G.tut});
  }
  V3D.render();
  requestAnimationFrame(loop);

function tick(dt){
  if(!G.running)return;
  if(G.phase==='stop'){
    G.phaseT+=dt;
    // long enough for riders to climb down and the new ones to walk in through the sliding door
    if(G.phaseT>2.8){G.phase='drive';G.segT=0;G.segDur=G.lv.time;G.warned=false;G.waitSaid=0;V3D.depart(G.stopIdx);nextPax();}
  }else if(G.phase==='drive'){
    if(!G.tut)G.segT+=dt;const p=G.segT/G.segDur,left=G.segDur-G.segT;
    const nxt=G.stopIdx+1,lastI=G.lv.stops.length-1;
    if(!G.alightAsked&&p>0.5&&nxt<lastI&&G.onboard.some(o=>o.dest===nxt)){const b=$('#alight');if(b.hidden){b.hidden=false;b.textContent=`على جنب يا أسطى! (${G.lv.stops[nxt][0]})`;V3D.callStop(nxt,G.lv.stops[nxt][0]);}}
    // the passenger you're serving gets impatient if their change takes long
    if(G.mode==='change'&&G.cur&&!G.tut){const w=G.segT-G.curStart;if(w>6&&G.waitSaid<1){G.waitSaid=1;V3D.waiting(G.cur,1);}else if(w>11&&G.waitSaid<2){G.waitSaid=2;V3D.waiting(G.cur,2);}}
    if(!G.paid&&!G.warned&&left<G.lv.time*0.32){G.warned=true;driverSay('يلا الأجرة يا جماعة! المحطة قربت',true);}
    const bar=$('#patience');
    if(G.paid){bar.style.width='100%';bar.style.backgroundColor='var(--good)';}
    else{const f=Math.max(0,1-p);bar.style.width=(f*100)+'%';bar.style.backgroundColor=f>0.5?'var(--good)':f>0.25?'var(--mustard)':'var(--bad)';}
    routeProgress(G.stopIdx+Math.min(1,p));
    if(G.segT>=G.segDur){
      if(!G.paid){
        G.queue.forEach(q=>q.parts.forEach(pt=>G.onboard.push({dest:pt.dest,n:pt.n})));if(G.cur&&G.mode==='change')G.cur.parts.forEach(pt=>G.onboard.push({dest:pt.dest,n:pt.n}));
        G.queue=[];G.cur=null;resetFloat();
        driverSay('فين الأجرة يا باشا؟! إحنا وصلنا',true);
        if(strike())return;
      }
      G.stopIdx++;enterStop();
    }
  }
}
function nextPax(){
  if(!G.running||G.phase!=='drive')return;
  if(G.queue.length){
    G.cur=G.queue.shift();G.tray=[];G.curStart=G.segT;G.mode='change';G.asked=false;G.breakMode=false;G.waitSaid=0;wAdd(G.cur.paid);
    renderChange();sfx(G.cur.paid.some(v=>v>=5)?'bill':'coin');V3D.pay(G.cur);
  }else if(!G.paid){
    G.mode='driver';G.kp='';renderDriver();driverSay('هات الأجرة يا كابتن! كام؟');V3D.alreadyPaid();
  }
}
function giveChange(){
  const c=G.cur;if(!c||G.mode!=='change')return;
  const given=sum(G.tray),diff=r2(given-c.change);let msg,good;
  if(eq(diff,0)){good=true;const bonus=Math.max(0,Math.round(6-(G.segT-G.curStart)/1.5));G.score+=10+bonus;msg=pick(THANKS);sfx('good');popAt('+'+(10+bonus));}
  else{good=false;msg=diff<0?`ناقص ${fmt(-diff)} جنيه يا كابتن! الباقي ${fmt(c.change)}`:`ده زيادة ${fmt(diff)} جنيه... الباقي كان ${fmt(c.change)}`;}
  c.parts.forEach(pt=>G.onboard.push({dest:pt.dest,n:pt.n}));
  G.mode='busy';
  const r=panel.querySelector('.react');if(r){r.textContent=msg;r.className='react '+(good?'good':'bad');}
  V3D.react(c,good,msg);
  panel.querySelectorAll('.pouch button,.go').forEach(b=>b.disabled=true);
  if(!good&&strike())return;
  hud();
  const tk=G.token;setTimeout(()=>{if(G.token===tk&&G.running)nextPax();},good?700:1500);
}
function payDriver(){
  if(G.mode!=='driver')return;
  const v=parseFloat(G.kp||'0'),total=sum(G.batch.map(b=>b.fare));
  G.paid=true;G.mode='relax';resetFloat();
  if(eq(v,total)){const left=Math.max(0,G.segDur-G.segT);const bonus=Math.round(left);G.score+=20+bonus;sfx('good');popAt('+'+(20+bonus));driverSay(pick(['تسلم إيدك يا كبير، وخد الفكة دي معاك','عاش يا كابتن، خد شوية فكة','حلو أوي، كده مظبوط. خلي الفكة دي معاك']));renderRelax(true,total);}
  else{driverSay(`دول ${fmt(v)} بس؟ الأجرة ${fmt(total)} يا باشا!`,true);renderRelax(false,total);if(strike())return;}
  G.segDur=Math.min(G.segDur,G.segT+3.5);hud();
}
function strike(){
  G.strikes++;sfx('bad');panel.classList.remove('shake');void panel.offsetWidth;panel.classList.add('shake');hud();
  if(G.strikes>=G.lv.lives){G.running=false;G.mode='idle';S.target=0;const tk=G.token;setTimeout(()=>{if(G.token===tk)showGameOver();},1300);return true;}
  return false;
}
function finishLevel(tk){
  if(tk!==G.token)return;G.running=false;
  const stars=Math.max(1,3-G.strikes),prev=save.stars[G.li]||0;if(stars>prev){save.stars[G.li]=stars;persist();}
  showResult(stars);
}

function money(v,tag='span',extra='',count){
  const cls=v<5?'coin':'bill',k='v'+String(v).replace('.','_');
  const inner=v<5?(v===0.5?'٥٠<small>ق</small>':'١ج'):`${toAr(v)}<i>${v}</i>`;
  const badge=count==null?'':`<em class="cnt">${count}</em>`;
  return `<${tag} class="${cls} ${k}" ${extra}>${inner}${badge}</${tag}>`;
}
function hud(){
  $('#score').textContent=G.score;
  const lives=G.lv?G.lv.lives:3;
  $('#strikes').innerHTML=Array.from({length:lives},(_,i)=>`<i class="${i<lives-G.strikes?'':'lost'}"></i>`).join('');
  $('#hudRoute').textContent=G.lv?G.lv.route:'الأجرة ورا';
  renderRoute();
}
function renderRoute(){
  const el=$('#route');if(!G.lv){el.innerHTML='';return;}

function routeProgress(pos){const f=$('#rfill');if(f&&G.lv)f.style.width=(pos/(G.lv.stops.length-1)*100)+'%';}
function renderFares(){

function driverSay(t,angry){V3D.driverSay(t,angry);}
function popAt(text,bad){const p=document.createElement('div');p.className='pop'+(bad?' bad':'');p.textContent=text;const r=$('#score').getBoundingClientRect();p.style.left=(r.left-10)+'px';p.style.top=(r.bottom+4)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),950);}
function onboardChips(){

}
function renderPouch(){
  const brk=G.breakMode;
  $('#pouch').innerHTML=pouchDenoms().map(v=>{
    const n=G.wallet[v]||0,can=brk?(n>0&&BREAK[v]&&(v!==1||G.lv.half)):n>0;

  }).join('');
  $('#pouchLbl').innerHTML=brk?'<b class="hint">اختار الورقة اللي عايز الأسطى يفكهالك (هتاخد 3 ثواني)</b>':`الفكة اللي في جيبك: <b>${fmt(wTotal())} ج</b>`;

function updateTray(){

function askFakka(){
  const c=G.cur;if(G.asked||G.mode!=='change')return;G.asked=true;G.segT+=1;
  const r=panel.querySelector('.react');
  if(Math.random()<0.55){
    G.tray.forEach(v=>wAdd([v]));G.tray=[];
    c.paid.forEach(v=>{G.wallet[v]=Math.max(0,(G.wallet[v]||0)-1);});
    const lv=G.lv,maxB=lv.bills[lv.bills.length-1];
    const amt=Math.random()<0.6?c.fare:Math.ceil(c.fare/5)*5;
    c.paid=decompose(amt,maxB,lv.half);c.change=r2(sum(c.paid)-c.fare);wAdd(c.paid);
    renderChange();sfx('coin');
    const r2el=panel.querySelector('.react');r2el.textContent=c.change?'آه، خد دول بدالها':'آه، خد مظبوط أهو';r2el.className='react good';V3D.line(c,r2el.textContent);
  }else{r.textContent=pick(['لا والله، معاييش غير دي','ما معاييش فكة يا كابتن','منين يا حسرة؟']);r.className='react bad';renderPouch();V3D.line(c,r.textContent,true);}
}
function breakBill(v){
  if(!G.wallet[v]||!BREAK[v])return;

  driverSay(pick(['هات أفكّهالك، بس بسرعة','يا عم الفكة دي آخر حاجة معايا','خد، وما تطلبش تاني']),true);

panel.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;audioInit();
  const act=b.dataset.act;
  if(act==='add'&&G.mode==='change'){const v=parseFloat(b.dataset.v);if(G.breakMode){breakBill(v);return;}if(!G.wallet[v])return;G.wallet[v]--;G.tray.push(v);sfx(v<5?'coin':'bill');updateTray();}
  else if(act==='rm'&&G.mode==='change'){wAdd(G.tray.splice(+b.dataset.i,1));updateTray();}
  else if(act==='clear'&&G.mode==='change'){wAdd(G.tray);G.tray=[];updateTray();}
  else if(act==='ask')askFakka();
  else if(act==='brk'&&G.mode==='change'){G.breakMode=!G.breakMode;renderPouch();}
  else if(act==='give')giveChange();
  else if(act==='kp'&&G.mode==='driver'){const k=b.dataset.k;if(k==='.5'){if(!G.kp.includes('.'))G.kp=(G.kp||'0')+'.5';}else if(!G.kp.includes('.')&&G.kp.length<5){G.kp=(G.kp==='0'?'':G.kp)+k;}sfx('coin');updateKp();}
  else if(act==='kpdel'&&G.mode==='driver'){G.kp=G.kp.endsWith('.5')?G.kp.slice(0,-2):G.kp.slice(0,-1);updateKp();}
  else if(act==='pay')payDriver();
  else if(act==='horn')sfx('horn');
});

$('#alight').addEventListener('click',()=>{audioInit();G.alightAsked=true;$('#alight').hidden=true;G.score+=5;popAt('+5');hud();driverSay('حاضر يا باشا');});
document.addEventListener('keydown',e=>{

    <div class="tbl">${l.stops.slice(1).map(s=>`<span>${s[0]}<b>${fmt(s[1])} ج</b></span>`).join('')}</div>
    <div class="row"><span class="row-label">الفكة اللي الأسطى هيديهالك:</span><div class="money">${Object.keys(l.float).sort((a,b)=>a-b).map(k=>money(+k,'span','',l.float[k])).join('')}</div></div>
    <p class="row-label">قدامك ${l.time} ثانية بين كل محطة والتانية. معاك ${l.lives} فرص (الخرز الأزرق فوق). ${l.help===2?'المشوار ده هيوريك الحساب كله.':l.help===1?'هيوريك الأجرة، وإنت تحسب الباقي.':'من غير مساعدة: الحساب كله عليك.'}</p>
    <p class="row-label">الأغنية: ${trackName(l.track)}</p>
    <div class="btns"><button class="go alt" data-o="menu">رجوع</button><button class="go" data-o="start" data-l="${i}">اركب يا كابتن</button></div>
  </div></div>`;ov.hidden=false;
}
function showResult(stars){
  const nextOk=G.li+1<LEVELS.length;
  ov.innerHTML=`<div class="sheet"><div class="card">
    <h2>وصلنا ${G.lv.stops[G.lv.stops.length-1][0]}!</h2>
    <div class="stars">${starsHTML(stars)}</div>
    <div class="tbl"><span>النقط<b>${G.score}</b></span><span>الغلطات<b>${G.strikes}</b></span></div>
    <p>${stars===3?'الأسطى عايز يشغّلك معاه على طول.':stars===2?'حلو، بس فيه حساب باظ منك.':'وصلت، بس الأسطى مش مبسوط أوي.'}</p>
    <div class="btns"><button class="go alt" data-o="retry">تاني</button>${nextOk?`<button class="go" data-o="intro" data-l="${G.li+1}">المشوار الجاي</button>`:`<button class="go" data-o="menu">القائمة</button>`}</div>
  </div></div>`;ov.hidden=false;
}
function showGameOver(){
  ov.innerHTML=`<div class="sheet"><div class="card">
    <h2>الأسطى نزّلك من الميكروباص!</h2>
    <p>غلطت ${G.strikes} مرات في الحساب. "انزل يا عم، إنت هتخرب بيتي."</p>
    <div class="tbl"><span>النقط<b>${G.score}</b></span><span>وصلت لحد<b>${G.lv.stops[G.stopIdx][0]}</b></span></div>
    <div class="btns"><button class="go alt" data-o="menu">القائمة</button><button class="go" data-o="retry">جرب تاني</button></div>
  </div></div>`;ov.hidden=false;
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-o]');if(b&&!b.disabled){audioInit();const o=b.dataset.o;
    if(o==='resume')closeOv();
    else if(o==='howto')startTour();
    else if(o==='intro'){G.token++;G.running=false;G.mode='idle';showIntro(+b.dataset.l);}
    else if(o==='start')startLevel(+b.dataset.l);
    else if(o==='retry')showIntro(G.li);
    else if(o==='back')openMenu(G.paused);
    else if(o==='menu'){G.token++;G.running=false;G.mode='idle';G.lv=null;hud();renderFares();panelWait('الأجرة ورا','اختار مشوار من القائمة');openMenu(false);}
  }
  if(e.target.id==='tglHelp'){save.alwaysHelp=!save.alwaysHelp;persist();e.target.setAttribute('aria-pressed',save.alwaysHelp);e.target.textContent=save.alwaysHelp?'شغال':'مقفول';}
});
$('#btnMenu').addEventListener('click',()=>{audioInit();openMenu(true);});

/* ---------- boot ---------- */
/* ---------- guided first ride ("إزاي تلعب؟") ----------
   A real practice ride with one fixed passenger and the clock stopped. A spotlight shows the one thing to
   look at or tap, and the bubble says what to do; action steps only move on once the player has done it. */
const TOUR=[
 {txt:'أهلاً يا كابتن! 👋<br>هنعمل مع بعض <b>مشوار تجريبي</b> خطوة بخطوة.<br>الوقت واقف، وماتقلقش من الغلط.',btn:'يلا بينا'},
 {sel:'#stage',txt:'ده الميكروباص من جوه. إنت قاعد <b>ورا الأسطى</b>، والشارع الحقيقي بيعدّي من الشبابيك. شغلتك تلم الأجرة من الركاب وتديها للأسطى. اللي بيتكلم <b>كلامه بيطلع فوق راسه</b>.'},
 {sel:'#route',txt:'دي <b>المحطات</b>. إحنا دلوقتي في موقف رمسيس ورايحين عبود من شارع أحمد حلمي.'},
 {sel:'#fares',txt:'دي <b>التعريفة</b>: سعر كل محطة للفرد. <b>موقف الشيخ بـ ٥ جنيه</b>.'},
 {txt:'استنى... فيه راكب طالع 🚶',until:()=>G.mode==='change'},
 {sel:'.panel .pax',txt:'الراكب بيقولك رايح فين وكام واحد: <b>«واحد لموقف الشيخ»</b>.<br>يعني الأجرة = ١ × ٥ = <b>٥ جنيه</b>.'},
 {sel:()=>panel.querySelector('.money')&&panel.querySelector('.money').closest('.row'),txt:'إدّاك <b>١٠ جنيه</b>.<br>يبقى الباقي = ١٠ − ٥ = <b>٥ جنيه</b>.'},
 {sel:'#pouch',txt:'دي <b>الفكة اللي في جيبك</b>. هنرجّع <b>خمسة جنيه</b>.'},
 {sel:'#pouch .v5',txt:'👆 <b>دوس على الخمسة جنيه</b>.',act:true,until:()=>G.tray.some(v=>v===5)},
 {sel:'.panel .btns.small',txt:'لو الفكة اللي معاك مش مكفية: اسأل الراكب <b>«معاك فكة؟»</b> أو خلّي الأسطى <b>«يفكّ»</b> لك ورقة كبيرة.',
  pre:()=>{if(!eq(sum(G.tray),5)){wAdd(G.tray);G.tray=[5];G.wallet[5]--;updateTray();}}},
 {sel:'#giveBtn',txt:'👆 تمام! <b>دوس «خد الباقي»</b> عشان تدي الراكب باقيه.',act:true,until:()=>G.mode!=='change'},
 {txt:'الراكب خد باقيه 👍',until:()=>G.mode==='driver'},
 {sel:'.panel .log',txt:'كل الركاب دفعوا، و<b>الأسطى مد إيده</b>. لازم تقوله <b>مجموع الأجرة</b> اللي لميتها: <b>٥ جنيه</b>.'},
 {sel:'.keypad [data-k="5"]',txt:'👆 <b>اكتب ٥</b>.',act:true,until:()=>G.kp.startsWith('5'),post:()=>{G.kp='5';updateKp();}},
 {sel:'[data-act="pay"]',txt:'👆 <b>دوس «خد يا أسطى»</b>.',act:true,until:()=>G.mode!=='driver'},
 {sel:'#stage',txt:'الشريط <b>الأخضر</b> اللي تحت الشارع ده هو الوقت لحد المحطة الجاية. في اللعب بجد لازم تخلّص الحساب <b>قبل ما يخلص</b>.'},
 {sel:'#strikes',txt:'ده <b>الخرز الأزرق</b>: فرصك. كل غلطة في الحساب بتاخد واحدة.'},
 {sel:'#btnMenu',txt:'ومن هنا <b>القائمة</b>: تختار المشوار، ولو نسيت دوس <b>«إزاي تلعب؟»</b> وهنعيد الجولة دي.'},
 {txt:'برافو يا كابتن! 🎉<br>ساعات هيظهر زرار <b>«على جنب يا أسطى»</b>: دوس عليه لما راكب عايز ينزل.<br>يلا نبدأ المشوار الأول بجد!',btn:'اركب يا كابتن',end:true},
];
const T={i:-1,el:null,raf:0,wait:0};
function startTour(){
  startLevel(0);G.tut=true;
  const p=makePax(0,new Set());
  Object.assign(p,{parts:[{n:1,dest:2}],fare:5,paid:[10],change:5,text:'يا ريس، واحد لموقف الشيخ'});
  G.queue=[p];G.batch=[p];
  V3D.start(0,G.lv.stops.map(s=>s[0]),G.lv.tod);V3D.arrive(0,G.queue,false);   // the 3D bus gets the tour's passenger, not the random one
  if(!T.el){
    T.el=document.createElement('div');T.el.className='tour';
    T.el.innerHTML='<div class="tb"></div><div class="tb"></div><div class="tb"></div><div class="tb"></div><div class="tb cover"></div><div class="th"></div><div class="tt"><div class="tx"></div><div class="tf"><button class="skip">تخطّي</button><span class="tn"></span><button class="go nx"></button></div></div>';
    document.body.appendChild(T.el);
    T.el.querySelector('.skip').onclick=()=>endTour(false);
    T.el.querySelector('.nx').onclick=()=>{const s=TOUR[T.i];if(s&&s.end)endTour(true);else tourGo(T.i+1);};
  }
  T.el.hidden=false;tourGo(0);
  cancelAnimationFrame(T.raf);T.raf=requestAnimationFrame(tourFrame);
}
function tourTarget(s){if(!s||!s.sel)return null;return typeof s.sel==='function'?s.sel():document.querySelector(s.sel);}
function tourGo(i){
  T.i=i;const s=TOUR[i];if(!s)return endTour(true);
  if(s.pre)s.pre();
  T.el.querySelector('.tx').innerHTML=s.txt;
  const nx=T.el.querySelector('.nx');nx.hidden=!!(s.act||s.until);nx.textContent=s.btn||'التالي';
  T.el.querySelector('.tn').textContent=`${i+1} / ${TOUR.length}`;
  T.el.classList.toggle('act',!!s.act);T.wait=0;
  const t=tourTarget(s);if(t)t.scrollIntoView({block:'nearest'});
}
function tourFrame(){
  if(!G.tut)return;
  const s=TOUR[T.i],t=tourTarget(s),[top,bot,lft,rgt,cover]=T.el.querySelectorAll('.tb'),hole=T.el.querySelector('.th'),tip=T.el.querySelector('.tt');
  const W=innerWidth,H=innerHeight;
  let r=t?t.getBoundingClientRect():null;if(r&&r.width===0)r=null;
  if(r&&(r.top<0||r.bottom>H)){t.scrollIntoView({block:'center'});r=t.getBoundingClientRect();}   // keep the spot on screen
  const pad=6,x=r?r.left-pad:W/2,y=r?r.top-pad:H/2,w=r?r.width+pad*2:0,h=r?r.height+pad*2:0;
  const set=(e,a,b,c,d)=>{e.style.left=a+'px';e.style.top=b+'px';e.style.width=Math.max(0,c)+'px';e.style.height=Math.max(0,d)+'px';};
  set(top,0,0,W,y);set(bot,0,y+h,W,H-y-h);set(lft,0,y,x,h);set(rgt,x+w,y,W-x-w,h);
  set(cover,x,y,w,h);cover.style.display=s&&s.act?'none':'block';   // only action steps let the tap through
  set(hole,x,y,w,h);hole.style.display=r?'block':'none';
  const tw=Math.min(340,W-24);tip.style.width=tw+'px';
  const th=tip.offsetHeight;
  let tx=r?Math.min(Math.max(12,r.left+r.width/2-tw/2),W-tw-12):(W-tw)/2,ty;
  if(!r)ty=(H-th)/2;else if(y+h+th+14<H)ty=y+h+10;else if(y-th-10>0)ty=y-th-10;else ty=Math.max(10,H-th-10);
  tip.style.left=tx+'px';tip.style.top=ty+'px';
  if(s&&s.until&&s.until()){if(!T.wait){T.wait=performance.now();if(s.post)s.post();}else if(performance.now()-T.wait>450)tourGo(T.i+1);}
  T.raf=requestAnimationFrame(tourFrame);
}
function endTour(play){
  G.tut=false;cancelAnimationFrame(T.raf);if(T.el)T.el.hidden=true;
  save.seenHowto=true;save.seenTour=true;persist();
  G.token++;G.running=false;G.mode='idle';G.lv=null;G.score=0;G.strikes=0;hud();renderFares();panelWait('الأجرة ورا','اختار مشوار من القائمة');
  if(play)showIntro(0);else openMenu(false);
}

hud();renderFares();panelWait('الأجرة ورا','اختار مشوار من القائمة');if(save.seenTour)openMenu(false);else startTour();
requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop);});
if(document.fonts&&document.fonts.load)document.fonts.load('12px Lalezar').then(()=>{}).catch(()=>{});
})();
</script>
